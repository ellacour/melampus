[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "RUF012"]
"tests/*.py" = ["N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["melampus"]
