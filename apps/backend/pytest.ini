[pytest]
DJANGO_SETTINGS_MODULE = melampus.settings.dev
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
markers =
    unit: Tests unitaires (pas de DB)
    integration: Tests d'intégration (avec DB)
    e2e: Tests end-to-end
