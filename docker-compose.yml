services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: melampus
      POSTGRES_USER: melampus
      POSTGRES_PASSWORD: melampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melampus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  makemigrations:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: python manage.py makemigrations
    environment:
      DJANGO_SETTINGS_MODULE: melampus.settings.dev
      DATABASE_URL: postgres://melampus:melampus@db:5432/melampus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate contenttypes && python manage.py migrate authentication && python manage.py migrate auth && python manage.py migrate"
    environment:
      DJANGO_SETTINGS_MODULE: melampus.settings.dev
      DATABASE_URL: postgres://melampus:melampus@db:5432/melampus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
      makemigrations:
        condition: service_completed_successfully

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: melampus.settings.dev
      DATABASE_URL: postgres://melampus:melampus@db:5432/melampus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A melampus worker -l INFO
    volumes:
      - ./apps/backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: melampus.settings.dev
      DATABASE_URL: postgres://melampus:melampus@db:5432/melampus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
    depends_on:
      backend:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A melampus beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./apps/backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: melampus.settings.dev
      DATABASE_URL: postgres://melampus:melampus@db:5432/melampus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_DEBUG: "True"
    depends_on:
      backend:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
